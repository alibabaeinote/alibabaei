<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Margin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A quiet place for small moments of self-awareness. Stays on your device.">
  <meta name="theme-color" content="#efece4">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Margin">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Privacy, enforced by the browser: scripts and styles only from this
       origin, and NO network connections from the page at all (connect-src 'none'). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/spline-sans-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:Georgia,serif">Margin needs JavaScript to run. Nothing leaves your device.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
